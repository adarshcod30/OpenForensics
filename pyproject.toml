[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openforensics"
version = "2.0.0"
description = "Deepfake face detection — three-backbone CNN ensemble"
# TensorFlow 2.19.1 publishes cp39-cp312 wheels and no cp313.
requires-python = ">=3.10,<3.13"

# Training and evaluation extras. Deliberately not a second requirements
# file: Streamlit Community Cloud globs for requirements*.txt and warns
# "More than one requirements file detected", risking the serving image
# pulling in scikit-learn, pandas and OpenCV it does not need.
#   pip install -e ".[train]"
[project.optional-dependencies]
train = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "opencv-python-headless>=4.9",
    "tqdm>=4.66",
    "pytest>=8.0",
    "tensorflow-metal==1.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
