[theme]
base = "dark"
primaryColor = "#2E9EB8"
backgroundColor = "#0E1418"
secondaryBackgroundColor = "#161E23"
textColor = "#E8EDF0"
font = "sans serif"

[server]
# Tracebacks stay off in the deployed app; pages surface their own errors
# with actionable text instead.
showErrorDetails = false
maxUploadSize = 20

[browser]
gatherUsageStats = false
